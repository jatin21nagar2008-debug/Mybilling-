<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BillingPro — Redirecting</title>
    <script>
      (function() {
        var pathname = window.location.pathname;
        var search = window.location.search || '';
        var hash = window.location.hash || '';

        // If repo path missing trailing slash (e.g. /Mybilling-)
        if (!pathname.endsWith('/')) {
          var segments = pathname.split('/').filter(Boolean);
          var target = window.location.origin + '/' + segments.join('/') + '/' + search + (hash || '#/');
          window.location.replace(target);
          return;
        }

        // Subroute: /Mybilling-/login -> /Mybilling-/#/login
        var segments = pathname.split('/').filter(Boolean);
        var repo = segments.length > 0 ? '/' + segments[0] : '';
        var route = segments.slice(1).join('/');
        var targetHash = route ? '#/' + route : (hash || '#/');
        window.location.replace(window.location.origin + repo + '/' + search + targetHash);
      })();
    </script>
  </head>
  <body style="background:#0f172a;color:#94a3b8;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
    <div style="text-align:center;">
      <h3 style="color:#f8fafc;margin-bottom:8px;">Opening BillingPro...</h3>
      <p style="font-size:13px;">Redirecting...</p>
    </div>
  </body>
</html>
